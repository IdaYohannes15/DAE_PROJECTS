<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KIPO</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-box {
            background-color: cornflowerblue;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .auth-box h2 {
            color: white;
            font-family: 'Courier New', Courier, monospace;
            font-size: 36px;
            text-align: center;
            margin: 0 0 30px 0;
            letter-spacing: 2px;
        }

        .auth-box input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            border: none;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            background-color: rgba(255,255,255,0.9);
            color: #333;
            box-sizing: border-box;
            outline: none;
            transition: background-color 0.2s;
        }

        .auth-box input:focus {
            background-color: white;
        }

        .auth-box input::placeholder {
            color: #888;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background-color: rgb(136, 176, 255);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            margin-top: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .auth-btn:hover {
            background-color: #5a8dee;
            transform: scale(1.02);
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: aliceblue;
        }

        .auth-link a {
            color: white;
            font-weight: bold;
            text-decoration: underline;
        }

        .auth-link a:hover {
            color: rgb(136, 176, 255);
        }
    </style>
</head>
<body>

    <header>
        <h1>KIPO</h1>
    </header>

    <div class="auth-container">
        <div class="auth-box">
            <h2>LOGIN</h2>
            <form action="login.php" method="POST">
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="auth-btn">LOGIN</button>
            </form>
            <div class="auth-link">
                Don't have an account? <a href="signup.html">Sign up here</a>
            </div>
        </div>
    </div>

</body>
</html>
